[project]
name = "netology-aiepro-ml-classifier-demo"
version = "0.1.0"
description = "Educational CTG classification: data research and reproducible pipelines"
requires-python = "==3.14.7"
dependencies = ["pydantic-settings", "requests"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty", "auto-typing-final", "httpx2"]
data = ["pandas", "numpy", "scikit-learn", "xlrd"]
tracking = ["mlflow"]
orchestration = ["apache-airflow==3.3.2"]
neural = ["torch"]
service = [{include-group = "data"}, "fastapi", "uvicorn", "modern-di", "modern-di-fastapi"]
research = [
    {include-group = "data"},
    {include-group = "neural"},
    "jupyterlab", "nbconvert", "nbformat", "ipykernel", "ipywidgets", "matplotlib", "seaborn", "tabulate", "optuna",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classifier", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tests/pytest-cache"

[tool.coverage.run]
data_file = "tests/.coverage"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN001", "ANN002", "ANN201", "CPY001", "D", "TC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["modern_di_fastapi.FromDI"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]


[tool.ty.src]
exclude = ["**/*.ipynb"]

[tool.uv]
default-groups = ["dev"]
