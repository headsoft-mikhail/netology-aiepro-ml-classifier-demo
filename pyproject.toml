[project]
name = "netology-aiepro-ml-classifier-demo"
version = "0.1.0"
description = "Educational CTG classification: data research and reproducible pipelines"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic-settings", "requests"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty", "auto-typing-final"]
data = ["pandas", "numpy", "scikit-learn", "xlrd"]
tracking = ["mlflow"]
research = [
    {include-group = "data"},
    "jupyterlab", "nbconvert", "nbformat", "ipykernel", "matplotlib", "seaborn", "tabulate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tests/pytest-cache"

[tool.coverage.run]
data_file = "tests/.coverage"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN001", "ANN002", "ANN201", "CPY001", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.uv]
default-groups = ["dev"]
